<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UGC NET General Paper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<button class="menu-toggle" id="menuToggle" aria-label="Toggle filters menu" aria-expanded="false">
  <i class="fa-solid fa-bars" id="menuToggleIcon" aria-hidden="true"></i>
</button>
<div class="backdrop" id="backdrop"></div>

<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h1>UGC NET</h1>
      <h1>General Paper</h1>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" id="tabBrowse" type="button">Browse</button>
      <a class="mode-tab" id="tabTest" href="test.html" target="_blank" rel="noopener">Practice Test</a>
    </div>

    <div class="sidebar-search">
      <input type="search" id="searchBox" placeholder="Search question text…">
    </div>

    <div class="filter-group" id="grpYear">
      <div class="filter-group-header" data-target="grpYear">
        <button class="fg-title-btn" type="button" data-target="grpYear">
          <span>Year</span><span class="chev">▾</span>
        </button>
        <label class="select-all-row" title="Select all / none">
          <input type="checkbox" data-selectall="year" checked><span>All</span>
        </label>
      </div>
      <div class="filter-group-body" id="yearFilterBody"></div>
    </div>

    <div class="filter-group" id="grpSession">
      <div class="filter-group-header" data-target="grpSession">
        <button class="fg-title-btn" type="button" data-target="grpSession">
          <span>Session</span><span class="chev">▾</span>
        </button>
        <label class="select-all-row" title="Select all / none">
          <input type="checkbox" data-selectall="session" checked><span>All</span>
        </label>
      </div>
      <div class="filter-group-body" id="sessionFilterBody"></div>
    </div>

    <div class="filter-group" id="grpSubject">
      <div class="filter-group-header" data-target="grpSubject">
        <button class="fg-title-btn" type="button" data-target="grpSubject">
          <span>Subject</span><span class="chev">▾</span>
        </button>
        <label class="select-all-row" title="Select all / none">
          <input type="checkbox" data-selectall="subject" checked><span>All</span>
        </label>
      </div>
      <div class="filter-group-body" id="subjectFilterBody"></div>
    </div>

    <div class="filter-group" id="grpUnit">
      <div class="filter-group-header" data-target="grpUnit">
        <button class="fg-title-btn" type="button" data-target="grpUnit">
          <span>Unit</span><span class="chev">▾</span>
        </button>
        <label class="select-all-row" title="Select all / none">
          <input type="checkbox" data-selectall="unit" checked><span>All</span>
        </label>
      </div>
      <div class="filter-group-body filter-group-body--compact" id="unitFilterBody"></div>
    </div>

    <div class="sidebar-footer">
      <span class="stat" id="loadedStat">Loading question bank…</span>
      <button class="btn-reset" id="resetFilters" type="button">Reset filters</button>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">

    <!-- ---- Browse view ---- -->
    <section id="browseView">
      <div class="main-header">
        <h2>Browse Questions</h2>
        <span class="result-count" id="resultCount"></span>
      </div>
      <div id="questionList"></div>
    </section>

  </main>
</div>

<script src="app.js"></script>
</body>
</html>
